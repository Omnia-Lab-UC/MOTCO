name: Publish to PyPI and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.4.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/motco/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Full history and tags: the release notes start after the previous tag.
          fetch-depth: 0
      # Before anything is uploaded, so a missing CHANGELOG.md entry stops the release.
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$RELEASE_TAG" > release-notes.md
      - name: Keep the release notes for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/motco/


  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
