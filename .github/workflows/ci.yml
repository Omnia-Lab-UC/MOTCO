name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # mypy pins python_version = "3.11" and the lockfile resolves one version of every
      # typed dependency, so one interpreter checks what the test matrix would.
      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/motco/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # One BLAS thread per pytest-xdist worker (tests/conftest.py sets the same default);
      # `-n logical` starts one worker per vCPU, where `auto` would count physical cores.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run fast tests
        env:
          MOTCO_TEST_PERMS: "99"
        run: uv run pytest tests/ -m "not slow" -n logical --dist worksteal --durations=15 --tb=short

      # The fast tests passed in the step above and MOTCO_TEST_PERMS reaches only the
      # slow regression tests, so this step runs the slow tier alone.
      - name: Run slow regression tests
        if: github.ref == 'refs/heads/main'
        env:
          MOTCO_TEST_PERMS: "10000"
        run: uv run pytest tests/ -m slow -n logical --dist worksteal --durations=15 --tb=short
