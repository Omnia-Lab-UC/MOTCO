    - Phases 1–4:
      - Latent configuration spectrum (2026-09-02): reports/latent-config-spectrum-2026-09-02.md
      - Geometry audit (2026-09-01): reports/geometry-audit-2026-09-01.md
      - Angle-null pivotality (2026-09-01): reports/angle-null-pivotality-2026-09-01.md
      - Orientation sign anchor (2026-08-28): reports/orientation-sign-anchor-2026-08-28.md
      - Phase 4 medium PLS pilot (2026-08-27): reports/phase4-medium-pls-pilot-2026-08-27.md
      - Realized generator geometry (2026-08-05): reports/realized-generator-geometry-2026-08-05.md
