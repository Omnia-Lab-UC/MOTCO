      - Orientation measurement probe (2026-10-12): reports/orientation-measurement-probe-2026-10-12.md
    - Phase 5 paper-grade study:
      - Magnitude re-measurement, joint construction (2026-10-08): reports/phase5-magnitude-remeasurement-2026-10-08.md
      - Phase 5 exit review (2026-09-10): reports/phase5-exit-review-2026-09-10.md
      - Paper-grade trajectory power study (2026-09-10): reports/phase5-paper-grade-2026-09-10.md
      - Magnitude-construction diagnostic (2026-09-10): reports/magnitude-construction-diagnostic-2026-09-10.md
      - Design-point pilot (2026-09-08): reports/phase5-design-point-pilot-2026-09-08.md
