site_name: MOTCO
site_description: Multi-omics Trajectory Comparison — latent spaces (PLS, SNF) and group differences
repo_url: https://github.com/Omnia-Lab-UC/MOTCO
repo_name: Omnia-Lab-UC/MOTCO

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: teal

nav:
  - Home: index.md
  - Scientific Roadmap: roadmap.md
  - Phase 5 Readiness: phase5-readiness.md
  - Study Reports:
    - Phase 5 latent-rank ladder (current): reports/latent-rank-ladder-2026-09-08.md
    - Phase 5 design-point pilot: reports/phase5-design-point-pilot-2026-09-08.md
    - Phase 4 medium PLS pilot (gate decision): reports/phase4-medium-pls-pilot-2026-08-27.md
    - M-value/PLS specificity pilot (historical, superseded): reports/mvalue-pls-pilot-2026-07-30.md
  - API Reference:
    - Real-Data Analysis: api/analysis.md
    - PLS-DA: api/pls.md
    - SNF: api/snf.md
    - Trajectory Analysis (SD): api/sd.md
    - Orientation Driver Attribution: api/attribution.md
    - Simulations: api/simulations.md
    - CLI: api/cli.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
