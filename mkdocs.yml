site_name: MOTCO
site_description: Multi-omics Trajectory Comparison — latent spaces (PLS, SNF) and group differences
repo_url: https://github.com/Omnia-Lab-UC/MOTCO
repo_name: Omnia-Lab-UC/MOTCO

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: teal

nav:
  - Home: index.md
  - Scientific Roadmap: roadmap.md
  - Measurement Visibility: measurement-visibility.md
  - Study Reports:
    - Measurement visibility:
      - Predictive-subspace size excess (2026-11-13): reports/predictive-size-excess-2026-11-13.md
      - Predictive-subspace coordinates (2026-11-12): reports/predictive-subspace-2026-11-12.md
      - Production latent-space selection (2026-11-10): reports/production-latent-space-2026-11-10.md
      - Interaction scan by block (2026-11-10): reports/interaction-scan-blocks-2026-11-10.md
      - Orthonormal span coordinates (2026-11-09): reports/orthonormal-coordinates-2026-11-09.md
      - Per-feature interaction scan (2026-11-09): reports/interaction-scan-2026-11-09.md
      - Split interaction test (2026-11-05): reports/span-split-2026-11-05.md
      - Stage-span paper grade (2026-11-04): reports/stage-span-paper-grade-2026-11-04.md
      - Stage-span pilot (2026-11-04): reports/stage-span-pilot-2026-11-04.md
      - Latent-space comparison (2026-11-04): reports/latent-space-comparison-2026-11-04.md
    - Real-data case study (Phase 6):
      - Phase 6 exit review (2026-11-02): reports/phase6-exit-review-2026-11-02.md
      - Plasmode attribution demonstration (2026-11-02): reports/plasmode-2026-11-02.md
      - Covariate-adjusted attribution (2026-11-02): reports/adjusted-attribution-2026-11-02.md
      - Operating characteristics at the ADNI design (2026-11-02): reports/adni-design-2026-11-02.md
      - Corrected-permutation check (2026-10-30): reports/corrected-permutation-2026-10-30.md
      - Case-study configuration diagnosis (2026-10-30): reports/case-study-diagnosis-2026-10-30.md
      - Case-study configuration Type I check (2026-10-29): reports/case-study-type-i-2026-10-29.md
      - Rank-floor check (2026-10-23): reports/rank-floor-2026-10-23.md
      - Latent-adjustment power comparison (2026-10-20): reports/latent-adjustment-power-2026-10-20.md
      - Latent-adjustment Type I check (2026-10-20): reports/latent-adjustment-type-i-2026-10-20.md
      - Covariate-adjustment Type I check (2026-10-16): reports/covariate-type-i-2026-10-16.md
      - Small-n operating study at the SEA-AD design (2026-10-09): reports/phase6-small-n-2026-10-09.md
