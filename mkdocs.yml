    - Real-Data Analysis: api/analysis.md
    - PLS-DA: api/pls.md
    - SNF: api/snf.md
    - Trajectory Analysis (SD): api/sd.md
    - Orientation Driver Attribution: api/attribution.md
    - Simulations: api/simulations.md
    - CLI: api/cli.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
